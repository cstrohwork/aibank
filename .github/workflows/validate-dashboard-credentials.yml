name: Validate Cloudflare dashboard credentials
on:
  push:
    paths:
      - '.github/workflows/validate-dashboard-credentials.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: f074af3bef137b9fbf206d8558c4b1d0
    steps:
      - name: Verify token and existing Worker access without logging secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "Missing Cloudflare token"; exit 1; }
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          status=$(curl --silent --show-error --max-time 30 --output "$response" --write-out '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          test "$status" = 200 && jq -e '.success == true and .result.status == "active"' "$response" >/dev/null || { echo "Token verification failed (HTTP $status)"; exit 1; }
          echo "Token active"
          status=$(curl --silent --show-error --max-time 30 --output "$response" --write-out '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/aibank-dashboard/settings")
          test "$status" = 200 && jq -e '.success == true' "$response" >/dev/null || { echo "Worker settings access failed (HTTP $status)"; exit 1; }
          echo "Existing Worker settings accessible; write permission and Access JWT still require deployment tests."

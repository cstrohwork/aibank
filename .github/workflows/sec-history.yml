name: Backfill SEC filing history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sec-history.yml'
      - 'scripts/sec_history.py'
      - 'scripts/sec_worker_control.py'
      - 'scripts/rebuild_history.py'
permissions:
  actions: write
  contents: write
concurrency:
  group: sec-edgar-cache
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEC_HISTORY_START: '2025-09-30'
      SEC_HISTORY_BATCH: '1000'
      # Each run processes a larger bounded batch; the worker queues the next run after a productive checkpoint.
      SEC_HISTORY_SECONDS: '1200'
      SEC_HISTORY_WORKERS: '3'
      SEC_USER_AGENT: 'CapitalSignal Research hello@ainvestmentbank.ai'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Record worker start time
        id: worker-start
        run: echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify historical calculations and amendment handling
        run: python -m unittest discover -s tests -v
      - name: Recover verified originals retained by failed runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sec_worker_control.py restore
      - name: Publish previously retained raw submissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if python scripts/release_history.py; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 15))
          done
      - name: Discover and archive the next filing batch
        id: archive
        run: python scripts/sec_history.py
      - name: Retain a recoverable checkpoint before publication
        if: always() && steps.archive.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: sec-history-checkpoint
          path: |
            CapitalSignal/data/history/archive_state.json.gz
            CapitalSignal/data/history/status.json
            CapitalSignal/data/history/raw/
            CapitalSignal/data/history/normalized/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Publish new raw submission shards
        id: release
        if: always() && steps.archive.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if python scripts/release_history.py; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 15))
          done
      - name: Rebuild period history and investor calculations
        if: always() && steps.archive.outcome != 'skipped' && steps.release.outcome == 'success'
        run: |
          python scripts/rebuild_history.py
          python scripts/build_investor_profiles.py
          python scripts/build_fund_firms.py
          python scripts/check_capitalsignal.py
      - name: Persist history and download checkpoints
        id: persist
        if: always() && steps.archive.outcome != 'skipped' && steps.release.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CapitalSignal/data/
          if ! git diff --cached --quiet; then
            git commit -m 'Backfill SEC history from 2025-09-30 and rebuild reporting periods'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                exit 1
              fi
              if git push origin HEAD:main; then exit 0; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
      - name: Queue the next productive batch immediately
        if: always() && steps.persist.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SEC_RUN_STARTED_AT: ${{ steps.worker-start.outputs.started_at }}
        run: python scripts/sec_worker_control.py continue
      - name: Publish backfill progress
        if: always()
        run: |
          echo '### SEC history backfill' >> "$GITHUB_STEP_SUMMARY"
          if [ -f CapitalSignal/data/history/status.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat CapitalSignal/data/history/status.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-history-progress
          path: |
            CapitalSignal/data/history/status.json
            worker-health.json
          retention-days: 30


name: Investor profile evidence queue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/investor-profile-queue.yml'
      - 'scripts/publish_investor_directory.py'
      - 'scripts/investor_profile_analytics.py'
      - 'scripts/build_investor_profiles.py'
      - 'scripts/build_fund_firms.py'
      - 'scripts/refresh_funds.py'
      - 'CapitalSignal/data/investor_profiles.json'
      - 'CapitalSignal/data/13f/**'
      - 'CapitalSignal/data/funds/**'
      # Voting disclosures are evidence for orientation, not ownership.
      # Revisit profiles when newly normalized N-PX evidence arrives.
      - 'CapitalSignal/data/npx/**'
      - 'CapitalSignal/data/n-px/**'
      - 'CapitalSignal/data/history/normalized/**'
      # Newly catalogued accessions/amendments may precede holdings parsing.
      - 'CapitalSignal/data/history/status.json'
  workflow_run:
    workflows: ['Refresh SEC EDGAR public-data cache', 'Backfill SEC filing history']
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
permissions:
  actions: write
  contents: write
concurrency:
  group: capitalsignal-profile-queue
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate and persist investor profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/publish_investor_directory.py --batch-size 2000
            # Fail closed on an inconsistent checkpoint; never publish a
            # manifest that counts profiles whose pages are absent.
            python -c 'import json; from pathlib import Path; r=Path("CapitalSignal/spotlight/investors"); m=json.loads((r/"manifest.json").read_text()); p=m["profiles"]; assert m["generated_count"]==len(p); assert m["pending_active_count"]+m["completed_current_version_count"]==m["cached_investor_count"]; assert m["never_published_remaining"]+m["refresh_remaining"]==m["pending_active_count"]; assert all(len(c)==10 and c.isdigit() and (r/c/"profile.json").exists() and (r/c/"index.html").exists() for c in p); print("Checkpoint validated:", m["changed_this_run"], "processed,", m["pending_active_count"], "pending")'
            # Publish machine-readable progress to the Actions job summary even
            # when the large manifest cannot be inspected through file readers.
            python - <<'PY'
            import json, os
            from pathlib import Path
            m = json.loads(Path('CapitalSignal/spotlight/investors/manifest.json').read_text())
            fields = [
                ('Discovered cached managers', 'cached_investor_count'),
                ('Current-version profiles', 'completed_current_version_count'),
                ('New/updated this batch', 'changed_this_run'),
                ('Pending', 'pending_active_count'),
                ('Eligible for next batch', 'eligible_pending_after_batch_count'),
                ('Retry cooldown', 'retry_cooldown_pending_count'),
                ('Failed active managers', 'failed_active_count'),
                ('Never published remaining', 'never_published_remaining'),
                ('Validated normalized USD', 'validated_normalized_usd_profile_count'),
                ('Without validated USD', 'without_validated_normalized_usd_count'),
            ]
            summary = '## Investor profile checkpoint\\n\\n| Measure | Count |\\n|---|---:|\\n'
            summary += ''.join(f'| {label} | {m.get(key, "unknown")} |\\n' for label, key in fields)
            summary += '\\nCounts refer only to the discovered cached manager universe; not all institutional funds.\\n'
            with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                out.write(summary)
            print(summary)
            PY
            git add CapitalSignal/spotlight/investors/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Generate investor profiles from latest ingested SEC cache"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investor-profile-progress
          path: CapitalSignal/spotlight/investors/manifest.json

      - name: Continue productive profile backlog without waiting for schedule
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only enqueue another run when the persisted checkpoint still has work.
          # The queue workflow's concurrency group serializes all invocations.
          pending=$(python -c 'import json; from pathlib import Path; p=Path("CapitalSignal/spotlight/investors/manifest.json"); print(int(json.loads(p.read_text()).get("pending_active_count", 0)))')
          # Do not spin on cooldown-only failures; the ten-minute schedule will retry.
          # Productive batches continue immediately until the eligible queue drains.
          changed=$(python -c 'import json; from pathlib import Path; p=Path("CapitalSignal/spotlight/investors/manifest.json"); print(int(json.loads(p.read_text()).get("changed_this_run", 0)))')
          eligible=$(python -c 'import json; from pathlib import Path; p=Path("CapitalSignal/spotlight/investors/manifest.json"); print(int(json.loads(p.read_text()).get("eligible_pending_after_batch_count", 0)))')
          if [ "$pending" -gt 0 ] && [ "$eligible" -gt 0 ] && [ "$changed" -gt 0 ]; then
            for attempt in 1 2 3; do
              if gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/investor-profile-queue.yml/dispatches" -f ref=main; then exit 0; fi
              sleep $((attempt * 5))
            done
            exit 1
          fi

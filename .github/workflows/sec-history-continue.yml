name: Continue SEC investor filing backlog
on:
  workflow_run:
    workflows: ["Backfill SEC filing history"]
    types: [completed]
permissions:
  actions: write
  contents: read
jobs:
  continue-if-current-quarter-pending:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check current-quarter investor filing backlog
        id: backlog
        env:
          SEC_RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          SEC_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          python - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          p = Path('CapitalSignal/data/history/status.json')
          data = json.loads(p.read_text()) if p.exists() else {}
          quarter = data.get('investor_filings', {}).get('current_quarter', {})
          pending = int(quarter.get('pending', 0) or 0)
          deferred = int(quarter.get('deferred', 0) or 0)
          downloaded = int(data.get('downloaded_this_run', 0) or 0)
          checked = data.get('checked_at') or data.get('updated_at') or ''
          started = os.environ.get('SEC_RUN_STARTED_AT', '')
          fresh = bool(checked and started and dt.datetime.fromisoformat(checked.replace('Z', '+00:00')) > dt.datetime.fromisoformat(started.replace('Z', '+00:00')))
          conclusion = os.environ.get('SEC_RUN_CONCLUSION', '')
          should_continue = fresh and (pending > 0 or deferred > 0) and (conclusion == 'success' or downloaded > 0)
          print(f"Pending: {pending}; deferred: {deferred}; downloaded in last run: {downloaded}; fresh checkpoint: {fresh}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"continue={'true' if should_continue else 'false'}\n")
          PY
      - name: Dispatch next SEC history batch
        if: steps.backlog.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST repos/${GITHUB_REPOSITORY}/actions/workflows/sec-history.yml/dispatches -f ref=main

name: Stage reviewed public site
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'CapitalSignal/**'
      - 'scripts/sync_public_site.py'
      - 'scripts/validate_public_site.py'
      - 'tests/test_sync_public_site.py'
      - 'tests/test_validate_public_site.py'
      - '.github/workflows/publish-public-site.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'CapitalSignal/**'
      - 'scripts/sync_public_site.py'
      - 'scripts/validate_public_site.py'
      - 'tests/test_sync_public_site.py'
      - 'tests/test_validate_public_site.py'
      - '.github/workflows/publish-public-site.yml'
permissions:
  contents: read
concurrency:
  group: public-site-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out only reviewed public inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            CapitalSignal/index.html
            CapitalSignal/daily
            CapitalSignal/weekly
            CapitalSignal/spotlight
            CapitalSignal/ownership
            CapitalSignal/fundamentals
            CapitalSignal/model
            CapitalSignal/skunkworks
            CapitalSignal/workerdashboard
            CapitalSignal/tools
            CapitalSignal/atlas
            CapitalSignal/subscribe
            CapitalSignal/data/atlas
            CapitalSignal/data/13f
            CapitalSignal/data/fundamentals
            scripts/sync_public_site.py
            scripts/validate_public_site.py
            tests/test_sync_public_site.py
            tests/test_validate_public_site.py
          sparse-checkout-cone-mode: false
      - name: Test allowlist, exclusions, secret scan, and exact staging
        run: |
          python3 -m unittest tests/test_sync_public_site.py
          python3 -m unittest tests/test_validate_public_site.py
          python3 -m py_compile scripts/sync_public_site.py scripts/validate_public_site.py
          python3 scripts/sync_public_site.py --stage-dir "$RUNNER_TEMP/public-site"
          python3 scripts/validate_public_site.py \
            --site-dir "$RUNNER_TEMP/public-site" \
            --report "$RUNNER_TEMP/public-site-validation.json"
      - name: Verify deployment credential is configured
        if: github.event_name != 'pull_request'
        env:
          PUBLIC_SITE_TOKEN: ${{ secrets.PUBLIC_SITE_TOKEN }}
        run: |
          if [ -z "$PUBLIC_SITE_TOKEN" ]; then
            echo "::error::Configure PUBLIC_SITE_TOKEN as a fine-grained token with Contents read/write access ONLY to cstrohwork/aibank_public."
            exit 1
          fi
      - name: Check out public destination with destination-only credential
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: cstrohwork/aibank_public
          token: ${{ secrets.PUBLIC_SITE_TOKEN }}
          path: public-destination
          fetch-depth: 1
      - name: Replace destination with exact reviewed tree
        if: github.event_name != 'pull_request'
        run: |
          rsync -a --delete --exclude='.git/' --exclude='CNAME' \
            "$RUNNER_TEMP/public-site/" public-destination/
          cd public-destination
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m "Publish reviewed public site from ${GITHUB_SHA}"
            git push origin HEAD:main
          else
            echo "Destination already matches reviewed public tree."
          fi
      - name: Confirm domain was not moved
        if: github.event_name != 'pull_request'
        run: |
          test ! -e "$RUNNER_TEMP/public-site/CNAME"
          test -f "$RUNNER_TEMP/public-site/.github/workflows/deploy-pages.yml"
          grep -q 'pages: write' "$RUNNER_TEMP/public-site/.github/workflows/deploy-pages.yml"
          grep -q 'id-token: write' "$RUNNER_TEMP/public-site/.github/workflows/deploy-pages.yml"
          echo "CNAME was not staged; DNS and source Pages remain unchanged."

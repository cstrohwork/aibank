name: SEC ingestion automatic recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sec-worker-recovery.yml'
      - 'scripts/sec_worker_control.py'
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ['Backfill SEC filing history', 'Refresh SEC EDGAR public-data cache']
    types: [completed]
permissions:
  actions: write
  contents: read
concurrency:
  group: sec-ingestion-supervisor
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts
            CapitalSignal/data/history/status.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resume stopped ingestion with cooldown and duplicate-run protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sec_worker_control.py supervise
      - name: Retain recovery decision and outstanding error counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-worker-recovery
          path: worker-recovery.json
          if-no-files-found: error
          retention-days: 14

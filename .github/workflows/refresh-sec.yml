name: Refresh SEC EDGAR public-data cache
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-sec.yml'
  # The five-minute supervisor reserves a daily slot. A second independent
  # timer could replace this workflow's single pending concurrency slot.
permissions:
  actions: write
  contents: write
concurrency:
  group: sec-edgar-cache
  cancel-in-progress: false
env:
  SEC_HISTORY_START: "2025-09-30"
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch SEC issuer index and selected filing histories
        env:
          SEC_USER_AGENT: 'CapitalSignal Research hello@ainvestmentbank.ai'
        run: python scripts/refresh_sec.py
      # Backfill 13F reporting periods beginning 2025-09-30
      - name: Fetch selected 13F manager information tables
        env:
          SEC_USER_AGENT: 'CapitalSignal Research hello@ainvestmentbank.ai'
          SEC_13F_START_DATE: '2025-09-30'
        run: python scripts/refresh_13f.py
      - name: Fetch SEC N-PORT underlying fund holdings
        env:
          SEC_USER_AGENT: 'CapitalSignal Research hello@ainvestmentbank.ai'
        run: python scripts/refresh_funds.py
      - name: Preserve full reporting-period history
        run: python scripts/rebuild_history.py
      - name: Aggregate fund-level holdings into registrant ownership profiles
        run: python scripts/build_fund_firms.py
      # Recalculate investor values using dollar-denominated 13F XML
      - name: Calculate investor profiles from 13F history
        run: python scripts/build_investor_profiles.py
      - name: Validate refreshed caches before production publication
        run: python scripts/check_capitalsignal.py
      - name: Commit refreshed public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CapitalSignal/data/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh SEC EDGAR issuer index and filing snapshots"
            for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 2))
          done
          fi
      - name: Retain refresh validation and coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-refresh-health
          path: |
            worker-health.json
            CapitalSignal/data/13f/index.json
            CapitalSignal/data/funds/index.json
          retention-days: 14
      - name: Resume ingestion after refresh success or failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh api --method POST repos/${GITHUB_REPOSITORY}/actions/workflows/sec-worker-recovery.yml/dispatches -f ref=main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done


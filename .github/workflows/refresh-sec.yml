name: Refresh SEC EDGAR public-data cache
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-sec.yml'
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: write
concurrency:
  group: sec-edgar-cache
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch SEC issuer index and selected filing histories
        env:
          SEC_USER_AGENT: 'CapitalSignal Research hello@ainvestmentbank.ai'
        run: python scripts/refresh_sec.py
      # Backfill 13F reporting periods beginning 2025-12-31
      - name: Fetch selected 13F manager information tables
        env:
          SEC_USER_AGENT: 'CapitalSignal Research hello@ainvestmentbank.ai'
          SEC_13F_START_DATE: '2025-12-31'
        run: python scripts/refresh_13f.py
      - name: Fetch SEC N-PORT underlying fund holdings
        env:
          SEC_USER_AGENT: 'CapitalSignal Research hello@ainvestmentbank.ai'
        run: python scripts/refresh_funds.py
      # Recalculate investor values using dollar-denominated 13F XML
      - name: Calculate investor profiles from 13F history
        run: python scripts/build_investor_profiles.py
      - name: Commit refreshed public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CapitalSignal/data/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh SEC EDGAR issuer index and filing snapshots"
            for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 2))
          done
          fi
